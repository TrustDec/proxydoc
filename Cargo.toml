[package]
name = "proxydoc"
version = "1.17.0"
edition = "2021"
authors = ["TrustDec <https://github.com/TrustDec>"]
description = "🩺 All-in-one terminal & dev tools proxy diagnostics and manager for developers."
homepage = "https://github.com/TrustDec/proxydoc"
repository = "https://github.com/TrustDec/proxydoc"
license = "MIT"
keywords = ["proxy", "cli", "diagnostics", "developer-tools", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["socks", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
indicatif = "0.17"
tabled = { version = "0.15", features = ["derive", "ansi"] }
anyhow = "1.0"
url = "2.5"

[profile.test]
opt-level = 1

